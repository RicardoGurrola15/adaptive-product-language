cases:
- case_id: es419_cta
  scenario: cta
  locale: es-419
  title: Save-search CTA
  context: A real-estate search screen lets a visitor save filters; the action stores a search for later use and does not guarantee matching results.
  audience: Renters comparing listings in Latin America
  surface: search screen > save-search button and helper text
  behavior: The primary action saves filters; no result or pricing promise is made.
  prompt: Compose the primary CTA and one supporting line for clarity and actionability.
  expected_constraints: [natural es-419, no invented promise, return CTA and supporting line]
  expected_findings: [clarity]
  positive_control: false
  composition: false
  rubric_applicability: {"completeness": true,"context_fit": true,"specificity": true,"coherence": true,"naturalness_non_robotic_rhythm": true,"commercial_congruence": true,"cta_clarity": true,"locale_quality": true,"claims_boundary": true}
  conditions: [baseline, light, balanced, performance]
- case_id: enus_login_screen
  scenario: login
  locale: en-US
  title: Login-screen composition
  context: An online learning platform supports email/password login and password recovery; social login is unavailable.
  audience: Adult learners returning to online courses
  surface: login screen > heading, fields, primary action, recovery link, error state
  behavior: A valid email/password submits to login; the recovery link starts password recovery; failed login does not create an account.
  prompt: Compose the login screen copy for idle, validation, and recovery states without adding authentication methods.
  expected_constraints: [plain US English, explicit recovery action, no social-login claim, state-aware labels]
  expected_findings: [composition, clarity, behavior-boundary]
  positive_control: false
  composition: true
  rubric_applicability: {"completeness": true,"context_fit": true,"specificity": true,"coherence": true,"naturalness_non_robotic_rhythm": true,"commercial_congruence": true,"cta_clarity": true,"locale_quality": true,"claims_boundary": true}
  conditions: [baseline, light, balanced, performance]
- case_id: es419_form_composition
  scenario: form
  locale: es-419
  title: Availability-request form
  context: A local service form collects date, contact method, and request details; submission requests an estimate and does not confirm an appointment.
  audience: People requesting a local service estimate
  surface: form screen > fields, helper text, submit action, submitted state
  behavior: Submit sends a request for review; no appointment slot is reserved.
  prompt: Compose the form labels, helper text, submit CTA, and submitted-state message.
  expected_constraints: [natural es-419, do not imply booking, one action per state, preserve fields]
  expected_findings: [composition, clarity, transparency]
  positive_control: false
  composition: true
  rubric_applicability: {"completeness": true,"context_fit": true,"specificity": true,"coherence": true,"naturalness_non_robotic_rhythm": true,"commercial_congruence": true,"cta_clarity": true,"locale_quality": true,"claims_boundary": true}
  conditions: [baseline, light, balanced, performance]
- case_id: enus_checkout
  scenario: checkout
  locale: en-US
  title: Payment-step boundary
  context: A ticket checkout collects attendee details before attempting payment; an order is complete only after payment succeeds.
  audience: People buying tickets for local events
  surface: checkout screen > step labels, payment CTA, pending and success states
  behavior: Payment is pending until the provider confirms success; leaving the page does not establish purchase.
  prompt: Compose step labels and confirmation language without implying payment success early.
  expected_constraints: [plain US English, no premature confirmation, distinguish pending from success]
  expected_findings: [composition, semantic-risk]
  positive_control: false
  composition: true
  rubric_applicability: {"completeness": true,"context_fit": true,"specificity": true,"coherence": true,"naturalness_non_robotic_rhythm": true,"commercial_congruence": true,"cta_clarity": true,"locale_quality": true,"claims_boundary": true}
  conditions: [baseline, light, balanced, performance]
- case_id: es419_error_recovery
  scenario: error-recovery
  locale: es-419
  title: Upload recovery
  context: A listing photo upload failed temporarily; retry is safe and unsaved text remains.
  audience: Sellers publishing property listings
  surface: upload form > error banner, retry CTA, fallback action
  behavior: Retry repeats the upload; the draft text remains available; no upload success is implied.
  prompt: Compose error title, explanation, retry CTA, and fallback action.
  expected_constraints: [state what happened, state what is preserved, safe retry and fallback, no blame]
  expected_findings: [recovery, clarity]
  positive_control: false
  composition: true
  rubric_applicability: {"completeness": true,"context_fit": true,"specificity": true,"coherence": true,"naturalness_non_robotic_rhythm": true,"commercial_congruence": true,"cta_clarity": true,"locale_quality": true,"claims_boundary": true}
  conditions: [baseline, light, balanced, performance]
- case_id: enus_paywall
  scenario: paywall
  locale: en-US
  title: Pricing transparency
  context: A paid promotion feature exists, but this prompt provides no price, renewal cadence, or trial terms.
  audience: Small businesses considering a promotion feature
  surface: paywall > benefit summary, price area, purchase and decline actions
  behavior: The purchase action may start a paid flow; price and renewal terms are unknown here.
  prompt: Draft a transparent paywall message and CTA using only supplied facts.
  expected_constraints: [no invented price or terms, disclose unknowns, no urgency, clear decline action]
  expected_findings: [unsupported-claim, transparency, anti-dark-pattern]
  positive_control: false
  composition: true
  rubric_applicability: {"completeness": true,"context_fit": true,"specificity": true,"coherence": true,"naturalness_non_robotic_rhythm": true,"commercial_congruence": true,"cta_clarity": true,"locale_quality": true,"claims_boundary": true}
  conditions: [baseline, light, balanced, performance]
- case_id: es419_localization
  scenario: localization
  locale: es-419
  title: Terminology localization
  context: Source says List your property for Latin America and uses apartment inconsistently with property.
  audience: Property owners listing homes in Latin America
  surface: listing flow > heading, field labels, terminology
  behavior: The flow creates a property listing; the fixture does not define a narrower property type.
  prompt: Propose localized copy and identify terminology decisions.
  expected_constraints: [natural es-419, preserve meaning, distinguish property and apartment, no unsupported property type]
  expected_findings: [localization, terminology]
  positive_control: false
  composition: false
  rubric_applicability: {"completeness": true,"context_fit": true,"specificity": true,"coherence": true,"naturalness_non_robotic_rhythm": true,"commercial_congruence": true,"cta_clarity": true,"locale_quality": true,"claims_boundary": true}
  conditions: [baseline, light, balanced, performance]
- case_id: enus_audit
  scenario: audit
  locale: en-US
  title: Read-only copy audit
  context: Screen says You are almost done, pay now to unlock your guaranteed offer, only 2 spots left, cancel anytime; no price, offer definition, or inventory evidence is provided.
  audience: Visitors evaluating a paid offer
  surface: paywall screen > headline, claim, scarcity message, CTA, cancellation line
  behavior: The fixture gives no evidence for the offer, scarcity, price, or cancellation policy.
  prompt: Perform a read-only audit with issues, severity, evidence, and safer next steps; do not rewrite.
  expected_constraints: [audit only, separate observed text from unverified claims, detect expected findings]
  expected_findings: [unsupported guarantee, unsupported scarcity, missing price, cancellation verification, manipulative urgency]
  positive_control: false
  composition: true
  rubric_applicability: {"completeness": true,"context_fit": true,"specificity": true,"coherence": true,"naturalness_non_robotic_rhythm": true,"commercial_congruence": true,"cta_clarity": true,"locale_quality": true,"claims_boundary": true}
  conditions: [baseline, light, balanced, performance]
