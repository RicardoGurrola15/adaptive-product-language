- case_id: es419_marketing
  scenario: marketing
  locale: es-419
  title: Promotion without false urgency
  context: A newsletter signup asks for an email and says readers can unsubscribe later; no discount or deadline is provided.
  audience: Readers subscribing to a local news newsletter
  surface: marketing signup > value proposition, consent line, submit CTA
  behavior: Submit subscribes the email; unsubscribe is available later; no offer expiry exists in the fixture.
  prompt: Compose promotional copy that states value without false urgency or guaranteed outcomes.
  expected_constraints: [natural es-419, no invented discount, clear consent, no scarcity]
  expected_findings: [unsupported-promotion, transparency]
  positive_control: false
  composition: true
  rubric_applicability: {"completeness": true,"context_fit": true,"specificity": true,"coherence": true,"naturalness_non_robotic_rhythm": true,"commercial_congruence": true,"cta_clarity": true,"locale_quality": true,"claims_boundary": true}
  conditions: [baseline, light, balanced, performance]
- case_id: enus_permissions
  scenario: permissions
  locale: en-US
  title: Camera permission boundary
  context: A document-scanning app requests camera permission only when a scan starts; denying it leaves the user on the scan screen.
  audience: People scanning documents on mobile
  surface: scan screen > permission rationale, system prompt lead-in, denial fallback
  behavior: Camera is needed to scan; denial keeps the user on the scan screen and does not block unrelated app areas.
  prompt: Compose permission rationale and fallback copy that explains the next step.
  expected_constraints: [plain US English, request only camera access, explain denial path, no broad access claim]
  expected_findings: [permission-scope, recovery, clarity]
  positive_control: false
  composition: true
  rubric_applicability: {"completeness": true,"context_fit": true,"specificity": true,"coherence": true,"naturalness_non_robotic_rhythm": true,"commercial_congruence": true,"cta_clarity": true,"locale_quality": true,"claims_boundary": true}
  conditions: [baseline, light, balanced, performance]

- case_id: es419_contextual_phone_landing
  scenario: marketing
  locale: es-419
  title: México phone landing composition
  context: Producto: tienda en línea mexicana de teléfonos reacondicionados con modelos, capacidad, grado estético, garantía de 90 días y envíos nacionales. Audiencia: personas que comparan un teléfono confiable sin pagar precio de estreno. Propuesta: elegir un equipo reacondicionado con especificaciones claras. Objetivo: llevar a comparar modelos y seleccionar un equipo. Claims permitidos: garantía de 90 días, envíos nacionales, capacidad, grado estético y condición reacondicionada. Claims prohibidos: precios, descuentos, inventario, entrega en fecha, batería nueva, certificación, rendimiento garantizado o ahorro garantizado.
  audience: Personas en México que comparan teléfonos reacondicionados antes de comprar
  surface: landing completa > hero, beneficios, confianza, catálogo/especificaciones, FAQ y CTA
  behavior: El CTA principal abre la comparación de modelos; el catálogo muestra modelos, capacidad y grado estético; la compra, el inventario, los precios y las fechas de entrega no están declarados.
  prompt: Redacta solo contenido textual estructurado para una landing completa; no propongas UI, layout, estilos ni componentes. Incluye hero, beneficios, confianza, catálogo/especificaciones, FAQ y CTA.
  expected_constraints: [es-419 México natural, contenido textual estructurado sin UI, cubre hero beneficios confianza catálogo-especificaciones FAQ CTA, propuesta coherente entre secciones, CTA para comparar modelos, solo claims permitidos]
  expected_findings: [composition, contextual-adaptation, unsupported-claim-boundary]
  positive_control: false
  composition: true
  copy_only: true
  visible_sections: [Hero, Beneficios, Confianza, Catálogo y especificaciones, FAQ, CTA]
  rubric_applicability: {"completeness": true,"context_fit": true,"specificity": true,"coherence": true,"naturalness_non_robotic_rhythm": true,"commercial_congruence": true,"cta_clarity": true,"locale_quality": true,"claims_boundary": true}
  conditions: [baseline, light, balanced, performance]
  invariants: [identifica producto audiencia dominio superficie objetivo riesgo locale y etapa de comparación, diferencia reacondicionado de nuevo sin prometer batería o certificación, mantiene garantía de 90 días y envíos nacionales sin ampliar sus condiciones, usa solo claims permitidos, no inventa precios descuentos inventario ni entregas, mantiene propuesta y CTA de comparar modelos entre secciones, entrega solo contenido textual estructurado sin UI]

- case_id: enUS_contextual_saas_landing
  scenario: marketing
  locale: en-US
  title: Contextual SaaS landing composition
  context: Product: a SaaS workspace that helps revenue-operations teams standardize lead-routing rules across regional sales teams. Audience: revenue-operations leaders reducing manual routing reviews. Objective: explain the workflow and invite a product walkthrough. Allowed claims: configurable routing rules, regional rule visibility, approval history, and guided walkthroughs. Prohibited claims: automatic revenue growth, CRM integrations, uptime, security certification, implementation time, pricing, free trial, or guaranteed compliance.
  audience: Revenue-operations leaders coordinating lead-routing rules across regions
  surface: full landing page > hero, benefits, trust, features, FAQ, CTA
  behavior: The primary CTA requests a guided product walkthrough; features describe configurable routing rules, regional visibility, and approval history only.
  prompt: Compose only structured visible copy for a full SaaS landing page; do not propose UI, layout, styles, components, diagnosis, rationale, or report metadata. Include hero, benefits, trust, features, FAQ, and CTA.
  expected_constraints: [natural en-US, structured visible copy only, cover hero benefits trust features FAQ CTA, coherent proposition across sections, CTA requests a guided walkthrough, only allowed claims]
  expected_findings: [composition, contextual-adaptation, unsupported-claim-boundary]
  positive_control: false
  composition: true
  copy_only: true
  visible_sections: [Hero, Benefits, Trust, Features, FAQ, CTA]
  rubric_applicability: {"completeness": true,"context_fit": true,"specificity": true,"coherence": true,"naturalness_non_robotic_rhythm": true,"commercial_congruence": true,"cta_clarity": true,"locale_quality": true,"claims_boundary": true}
  conditions: [baseline, light, balanced, performance]
  invariants: [identifies product audience domain surface objective risk locale and setup-stage context, names lead-routing rules and regional sales teams without promising revenue growth, keeps configurable rules regional visibility and approval history within declared boundaries, does not invent integrations uptime security certification implementation time pricing free trial or compliance, maintains one walkthrough CTA across sections, returns only structured visible copy without UI or report metadata]
